[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bioverity"
version = "0.1.0"
description = "Open research platform for continuously testing ecological knowledge."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "uvicorn>=0.30",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "jsonschema>=4.23"
]

[project.optional-dependencies]
media = ["pillow>=10.4"]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11"
]

[tool.hatch.build.targets.wheel]
packages = ["backend/bioverity"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
