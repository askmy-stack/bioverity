services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: bioverity
      POSTGRES_PASSWORD: bioverity
      POSTGRES_DB: bioverity
    ports:
      - "${BIOVERITY_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioverity -d bioverity"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      BIOVERITY_DATABASE_URL: postgresql+psycopg://bioverity:bioverity@db:5432/bioverity
    ports:
      - "${BIOVERITY_API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
